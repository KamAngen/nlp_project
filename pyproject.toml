[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-assignment-legal-agent"
version = "0.1.0"
description = "Collaborative Chinese legal study agent with memory, planning and multi-source RAG"
readme = "README_zh.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.2.1",
  "aspose-words>=26.3.0",
  "bitsandbytes>=0.45.5",
  "datasets>=3.0.0",
  "gradio>=5.25.0",
  "huggingface_hub>=0.28.0",
  "jieba>=0.42.1",
  "jionlp>=1.5.27",
  "langgraph>=0.2.60",
  "networkx>=3.2",
  "numpy>=1.26.0",
  "openpyxl>=3.1.2",
  "pandas>=2.2.0",
  "peft>=0.14.0",
  "PyYAML>=6.0.1",
  "kaggle>=1.6.17",
  "rank-bm25>=0.2.2",
  "rich>=13.9.0",
  "safetensors>=0.4.5",
  "torch>=2.4.0",
  "transformers>=4.51.0",
  "trl>=0.16.0",
  "tqdm>=4.66.0",
  "xlrd>=2.0.1"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
